name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
        include:
          - target: x86_64-pc-windows-gnu
            archive: zip
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (Windows target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install musl toolchain (static Linux target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate tag matches Cargo.toml version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag \"${GITHUB_REF_NAME}\" does not match Cargo.toml version \"${CARGO_VERSION}\""
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/ytb-wayback"
          IS_WIN=false
          if [ "${{ matrix.archive }}" = "zip" ]; then BIN="${BIN}.exe"; IS_WIN=true; fi
          STAGE="dist/stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          NAME="ytb-wayback-v${VERSION}-${{ matrix.target }}"
          if $IS_WIN; then
            (cd "$STAGE" && python3 -m zipfile -c "../${NAME}.zip" .)
          else
            (cd "$STAGE" && tar -czf "../${NAME}.tar.gz" .)
          fi
          echo "Packaged dist/${NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify Linux binary runs
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/*-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          /tmp/ytb-wayback --version | grep -F "${GITHUB_REF_NAME#v}"
          file /tmp/ytb-wayback

      - name: Compute checksums
        shell: bash
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ytb-wayback ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**