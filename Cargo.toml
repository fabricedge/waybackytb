[package]
name = "ytb-wayback"
version = "0.1.0"
edition = "2021"
description = "Download YouTube videos preserved by the Wayback Machine"
keywords = ["youtube", "wayback", "archive", "download", "recovery"]
categories = ["command-line-utilities", "multimedia"]
license = "MIT"
repository = "https://github.com/fabricedge/waybackytb"
readme = "README.md"
rust-version = "1.74"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1